name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly fuzz run with a fresh seed. Mutation fuzzing finds things on the
    # thousandth campaign that it missed on the first.
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  # The GUI tests pump Tk by hand and give up after a while, and "a while" has
  # to be measured against the machine they actually run on. Hosted runners are
  # shared: one run took 283s for a fuzz job that normally takes 27s, on an
  # unchanged commit. A budget sized for a quiet laptop turns that into a red
  # build, and a build that goes red because the fleet was busy trains everyone
  # to ignore the colour. The per-job timeout below is what catches a real hang.
  CRSYS_TEST_TIMEOUT: "300"

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Jobs here finish in under two minutes. The default ceiling is six hours,
    # so a deadlock would sit there burning the account's minutes instead of
    # reporting a failure.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Installing the package rather than naming its dependencies by hand is
      # what makes the constraints in pyproject.toml actually apply. Listing
      # them here let each Python version resolve whatever it liked, so the
      # declared cryptography>=42.0 floor was never enforced anywhere.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,argon2]"

      # The GUI tests need a display. On Linux they would otherwise skip
      # themselves, which would quietly leave a quarter of the suite unrun.
      - name: Run the suite (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/run_all.py

      - name: Run the suite
        if: runner.os != 'Linux'
        run: python tests/run_all.py

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # One interpreter, not the matrix. Ruff's findings do not vary by
          # operating system, and running it fifteen times would buy nothing.
          # Mypy's can vary by Python version — but mypy 2.x refuses to target
          # 3.9 at all, so a single run is the honest scope. What actually holds
          # the 3.9 floor is the test matrix, which runs the suite on 3.9 across
          # three operating systems.
          python-version: "3.12"

      # The package itself, so mypy can follow imports into cryptography, and
      # the pinned tools from the dev extra. Pinned deliberately: an unpinned
      # linter can turn a green build red with no code change, and this project
      # has already spent three CI runs on a signal it could not trust.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,argon2,dev]"

      # Blocking, not advisory. The tree is at zero findings as of this commit,
      # so there is no backlog to grandfather in — an advisory linter starting
      # from green can only decay. `ruff check .` rather than named paths, so a
      # directory added later is covered without anyone remembering to add it.
      - name: Lint
        run: python -m ruff check .

      # Paths come from [tool.mypy] files, so this and a local run cannot drift.
      - name: Types
        run: python -m mypy

      # Deliberately no `ruff format --check`. Measured before deciding: the
      # formatter would rewrite 28 of 36 files, +1703/-769 lines, reflowing
      # hand-aligned signatures and the comment layout that carries most of the
      # reasoning in this codebase. E501 at 88 columns already enforces the
      # limit the code actually observes.

  fuzz:
    name: Fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[argon2]"

      # A fixed seed on pull requests keeps failures reproducible; scheduled
      # runs use a fresh one so the campaign explores new ground over time.
      - name: Choose a seed
        id: seed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=$RANDOM$RANDOM" >> "$GITHUB_OUTPUT"
            echo "iterations=2000000" >> "$GITHUB_OUTPUT"
          else
            echo "value=20260802" >> "$GITHUB_OUTPUT"
            echo "iterations=150000" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz the parsers
        run: |
          python tests/test_fuzz.py \
            --iterations ${{ steps.seed.outputs.iterations }} \
            --seed ${{ steps.seed.outputs.value }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e ".[gui,argon2]" coverage

      - name: Measure
        run: |
          xvfb-run -a python -m coverage run --source=crsys,crsys_gui tests/run_all.py
          python -m coverage report --show-missing --sort=cover

      # The security-critical library is held to a real bar. The GUI is not
      # included: its modal dialogs are stubbed out in tests by design, and
      # folding them in would produce a number that means nothing.
      - name: Enforce the floor on the library
        run: |
          python -m coverage report --include='crsys/*' --fail-under=90
