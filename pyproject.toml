[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crsys"
version = "1.0.0"
description = "Hybrid public-key encryption: X25519 + Ed25519 + AEAD, with a CLI and a GUI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["encryption", "cryptography", "x25519", "ed25519", "public-key"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
argon2 = ["argon2-cffi>=23.1"]

[project.scripts]
crsys = "crsys.cli:main"

[project.gui-scripts]
crsys-gui = "crsys_gui.app:main"

[tool.setuptools]
packages = ["crsys", "crsys_gui"]
